<style>
:root{--bg:#f2f4ee;--card:#fff;--ink:#10231b;--mut:#5d7367;--line:#d5e0d8;--turf:#0f3d2e;--ball:#e8540f;--ok:#1d7a4d;--ga:.42;--hl:1;--glass:rgba(255,255,255,var(--ga));--glass-b:rgba(255,255,255,.7);--spring:cubic-bezier(.32,.72,0,1);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}

:root[data-theme=dark]{--bg:#0a1b14;--card:#10291d;--ink:#eaf2ec;--mut:#8fa99a;--line:#1f3d2d;--turf:#0a1b14;--ball:#ff7a3d;--ok:#5fd08e;--glass:rgba(24,48,36,var(--ga));--glass-b:rgba(255,255,255,.18)}
*{box-sizing:border-box}html,body{margin:0}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,system-ui,sans-serif;padding-bottom:calc(100px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}

h1,h2,.big{font-family:"Avenir Next Condensed","Arial Narrow",Impact,sans-serif;font-weight:700;letter-spacing:.01em;margin:0}
header{color:var(--ink);padding:18px 18px 8px;display:flex;gap:16px;align-items:center}
header .t{flex:1;min-width:0}header h1{font-size:32px;line-height:1.05}
header p{margin:4px 0 0;color:#b9d2c3;font-size:14px}
.ring{width:84px;height:84px;flex:none;position:relative}
.ring circle.p{transition:stroke-dasharray .8s var(--spring)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 22px "Avenir Next Condensed","Arial Narrow",sans-serif;text-align:center;line-height:1}
.ring small{display:block;font:500 10px -apple-system,sans-serif;color:#b9d2c3;margin-top:2px}
main{padding:16px 14px 0;max-width:640px;margin:0 auto}
main.in>*{animation:up .5s var(--spring) both}main.in>*:nth-child(2){animation-delay:.05s}main.in>*:nth-child(3){animation-delay:.1s}main.in>*:nth-child(n+4){animation-delay:.15s}
@keyframes up{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px}
h2{font-size:24px;margin-bottom:2px}.sub{color:var(--mut);font-size:14px;margin:0 0 8px}
.note{border-left:4px solid var(--ball);padding:8px 12px;margin:0 0 12px;font-size:14px;border-radius:0 12px 12px 0;background:color-mix(in srgb,var(--ball) 8%,transparent)}
.ex{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);cursor:pointer;transition:opacity .25s,transform .35s var(--spring)}
.ex:first-of-type{border-top:0}.ex:active{transform:scale(.98)}
.bx{width:28px;height:28px;border-radius:50%;border:2px solid var(--mut);flex:none;display:grid;place-items:center;color:#fff;font-size:15px;transition:background .25s,border-color .25s,transform .4s var(--spring)}
.ex.on .bx{background:var(--ok);border-color:var(--ok);transform:scale(1.12);animation:pop .45s var(--spring)}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.25)}100%{transform:scale(1.12)}}
.ex .tx{flex:1;min-width:0}.ex .nm{font-weight:600;font-size:16px;transition:color .25s}
.ex.on .nm{color:var(--mut);text-decoration:line-through}.ex.on{opacity:.7}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.c{font-size:13px;font-weight:600;padding:2px 10px;border-radius:99px;background:color-mix(in srgb,var(--turf) 12%,transparent);color:var(--ink)}
.c.s{background:color-mix(in srgb,var(--ball) 16%,transparent);color:var(--ball)}
.xt{font-size:13px;color:var(--mut);margin-top:3px}
.inf{width:34px;height:34px;flex:none;border-radius:50%;border:0;background:color-mix(in srgb,var(--ball) 14%,transparent);color:var(--ball);font-weight:700;font-size:16px;font-family:Georgia,serif;font-style:italic;transition:transform .3s var(--spring)}
.inf:active{transform:scale(.88)}
.sum{display:flex;gap:8px;margin:4px 0 6px;flex-wrap:wrap}
button,select,input,textarea{font:inherit;color:inherit}button{cursor:pointer;transition:transform .3s var(--spring),opacity .2s}button:active{transform:scale(.96)}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:15px;font-weight:600;font-size:17px;background:var(--ball);color:#fff;margin-top:12px;text-align:center;text-decoration:none}
.btn.done{background:var(--ok)}.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.row{display:flex;gap:8px;align-items:center;margin-top:10px}.row>*{flex:1}
.mood{display:flex;gap:6px}.mood button{flex:1;padding:11px 0;border-radius:12px;border:1px solid var(--line);background:transparent;transition:background .25s,color .25s,transform .3s var(--spring)}
.mood button.on{background:var(--turf);color:#f2f4ee;border-color:var(--turf)}
input,textarea,select{width:100%;padding:11px;border-radius:12px;border:1px solid var(--line);background:transparent;font-size:16px}
textarea{min-height:80px;resize:vertical}
label{font-size:13px;color:var(--mut);display:block;margin:10px 0 4px}
.wk{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--line);cursor:pointer;transition:transform .3s var(--spring)}.wk:active{transform:scale(.98)}
.wk:first-of-type{border-top:0}.wk .d{width:54px;font-weight:600}.wk .s{flex:1;color:var(--mut);font-size:14px}.wk.today .d{color:var(--ball)}
.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.nav button{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:8px 16px}
.ph{padding:10px 0;border-top:1px solid var(--line)}.ph:first-of-type{border-top:0}.ph.cur{border-left:4px solid var(--ball);padding-left:10px}
.ph b{font-size:16px}.ph div{font-size:14px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:3px;text-align:center}th{color:var(--mut);font-weight:500}td:first-child{text-align:left;width:34%}
td input{padding:6px 2px;text-align:center}
ul.tp{padding-left:18px;margin:6px 0}.tp li{margin-bottom:8px}
.srch{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:5;margin-bottom:12px}
.srch input{border-radius:99px;padding:13px 18px;background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--glass-b)}
.li{display:flex;align-items:center;gap:10px;padding:13px 0;border-top:1px solid var(--line);cursor:pointer;transition:transform .3s var(--spring)}.li:first-child{border-top:0}.li:active{transform:scale(.98)}
.li b{flex:1}.li span{color:var(--mut);font-size:20px}
.empty{text-align:center;color:var(--mut);padding:24px 0}

nav{-webkit-touch-callout:none;position:fixed;left:14px;right:14px;bottom:max(calc(env(safe-area-inset-bottom,0px) - 12px),8px);touch-action:none;-webkit-user-select:none;user-select:none;max-width:520px;margin:0 auto;display:flex;padding:6px;border-radius:34px;z-index:20;
background:var(--glass);-webkit-backdrop-filter:blur(var(--blur,26px)) saturate(190%) brightness(1.05);backdrop-filter:blur(var(--blur,26px)) saturate(190%) brightness(1.05);
border:1px solid var(--glass-b);box-shadow:0 10px 34px rgba(0,0,0,.18),0 2px 6px rgba(0,0,0,.08),inset 0 1.5px 0 rgba(255,255,255,.65),inset 0 -1px 0 rgba(255,255,255,.12)}
nav::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 45%);pointer-events:none}

nav.drag button.on:not(.pv){color:var(--mut)}nav button.pv{color:var(--ball)}nav button.pv svg{transform:scale(1.14)}nav button svg{transition:transform .3s var(--spring)}
body::after{content:"";position:fixed;left:0;right:0;bottom:0;height:calc(max(env(safe-area-inset-bottom,0px),8px) + 84px);background:linear-gradient(transparent,color-mix(in srgb,var(--bg) 38%,transparent));pointer-events:none;z-index:15}

.tg{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}.tg small{display:block;color:var(--mut);font-size:13px}
.swt{width:51px;height:31px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .25s}.swt::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .3s var(--spring)}.swt.on{background:var(--ok)}.swt.on::after{transform:translateX(20px)}
.sws{display:flex;gap:12px;flex-wrap:wrap;padding:4px 0}.sws button{width:38px;height:38px;border-radius:50%;border:3px solid transparent;padding:0;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}.sws button.on{border-color:var(--ink)}
input[type=range]{accent-color:var(--ball);padding:0}
main{zoom:var(--zm,1)}
@media(prefers-reduced-transparency:reduce),(prefers-contrast:more){nav{background:var(--card)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}}
body.rm *,body.rm *::before{animation:none!important;transition-duration:.01ms!important}
/* Bottom sheet */
#bd{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .35s;z-index:30}
#sh{position:fixed;left:0;right:0;bottom:0;max-height:86vh;overflow:auto;z-index:31;transform:translateY(105%);transition:transform .5s var(--spring);margin:0 auto;max-width:640px;
background:var(--glass);background-color:color-mix(in srgb,var(--card) 82%,transparent);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border:1px solid var(--glass-b);border-radius:30px 30px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.2),inset 0 1.5px 0 rgba(255,255,255,.5)}

#sh h2{font-size:28px}#sh ol{padding-left:20px;margin:8px 0}#sh li{margin-bottom:6px}
#sh .w{border-left:4px solid var(--ball);padding:8px 12px;border-radius:0 12px 12px 0;background:color-mix(in srgb,var(--ball) 8%,transparent);font-size:14px;margin-top:10px}
.yt{background:#ff0033}

.pls{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.pl{min-width:40px;height:34px;padding:0 10px;border-radius:99px;border:1.5px solid var(--line);background:transparent;font-size:14px;font-weight:600;color:var(--mut);transition:background .25s,color .25s,transform .3s var(--spring)}.pl.on{background:var(--ok);border-color:var(--ok);color:#fff}
.tmb{border:0;border-radius:99px;padding:7px 14px;background:color-mix(in srgb,var(--turf) 14%,transparent);font-weight:600;font-size:14px;margin-top:8px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.tile{background:color-mix(in srgb,var(--turf) 8%,transparent);border-radius:16px;padding:10px 4px;text-align:center}.tile b{display:block;font:700 22px "Avenir Next Condensed","Arial Narrow",sans-serif}.tile small{color:var(--mut);font-size:11px}
.tmr{font:700 68px "Avenir Next Condensed","Arial Narrow",sans-serif;text-align:center;font-variant-numeric:tabular-nums;margin:8px 0}
.seg{display:flex;gap:6px;margin:8px 0 4px}.seg button{flex:1;padding:9px 0;border-radius:99px;border:1px solid var(--line);background:transparent;font-size:14px}.seg button.on{background:var(--turf);color:#f2f4ee;border-color:var(--turf)}
.ln{fill:none;stroke:var(--ball);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.1s var(--spring) .15s forwards}@keyframes dr{to{stroke-dashoffset:0}}
.ar{fill:url(#g);opacity:0;animation:fi .8s .5s forwards}@keyframes fi{to{opacity:1}}
.bars{display:flex;gap:6px;align-items:flex-end}.bc{flex:1;text-align:center}.bc small{font-size:10px;color:var(--mut)}.trk{height:90px;display:flex;align-items:flex-end;background:color-mix(in srgb,var(--turf) 8%,transparent);border-radius:10px;overflow:hidden}.bar{width:100%;background:var(--ball);border-radius:8px 8px 0 0;transform-origin:bottom;animation:gr .8s var(--spring) both}@keyframes gr{from{transform:scaleY(0)}}
#mt{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(max(env(safe-area-inset-bottom,0px) - 12px,8px) + 76px);z-index:21;display:none;border:1px solid var(--glass-b);border-radius:99px;padding:9px 18px;font-weight:700;color:var(--ink);background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);box-shadow:0 6px 20px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.5);font-variant-numeric:tabular-nums;max-width:90vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

body.lkd #lk{display:flex}body.lkd{overflow:hidden}
.lkw{width:100%;max-width:340px;text-align:center}
.lkt{font-size:22px;font-weight:600;margin-bottom:6px}.lkm{min-height:20px;font-size:14px;color:#ffb899;margin-bottom:18px}

/* ===== Apple Music-style Home ===== */
header h1{font:800 38px/1.05 -apple-system,system-ui,sans-serif;letter-spacing:-.02em}
header p{color:var(--mut)}
.ring{width:60px;height:60px}.ring svg{width:100%;height:100%}
.ring circle:first-child{stroke:var(--line)}.ring circle.p{stroke:var(--ball)}
.ring b{font-size:15px}.ring small{font-size:8px;color:var(--mut);margin-top:1px}

.car{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -14px 18px;padding:2px 14px 14px;scroll-padding:0 14px;scrollbar-width:none;-webkit-overflow-scrolling:touch}

const lkH=async(pin,salt)=>{const k=await crypto.subtle.importKey('raw',lkEnc.encode(pin),'PBKDF2',false,['deriveBits']);return lkHx(await crypto.subtle.deriveBits({name:'PBKDF2',salt:lkEnc.encode(salt),iterations:100000,hash:'SHA-256'},k,256))};
const tpS=()=>{try{localStorage.setItem('ht_tp',PIN)}catch(e){}};
let LK=null;try{LK=JSON.parse(localStorage.getItem('ht_lk')||'null')}catch(e){}
async function mkLK(pin){const salt=lkHx(crypto.getRandomValues(new Uint8Array(16)));LK={s:salt,h:await lkH(pin,salt)};try{localStorage.setItem('ht_lk',JSON.stringify(LK))}catch(e){}}
let LS={m:'',b:'',f:'',msg:'',busy:0,until:0,fail:0},lkAway=0;
function lkShow(m){if(m=='unlock'&&!LK)return;LS={...LS,m,b:'',f:'',msg:'',busy:0};document.body.classList.add('lkd');lkR()}
function lkOpen(){HP('w');tpS();LS.m='';LS.b='';LS.fail=0;document.body.classList.remove('lkd');$('#lk').innerHTML='';go(tab,1);sync()}
function lkClose(){LS.m='';document.body.classList.remove('lkd');$('#lk').innerHTML=''}
function lkDots(){const d=$('#lkdt');if(d)d.innerHTML=[0,1,2,3,4,5].map(i=>`<i class="${i<LS.b.length?'f':''}"></i>`).join('')}
function lkX(){const x=$('#lkx');if(x)x.textContent=LS.b?'Delete':/^chg/.test(LS.m)?'Cancel':''}
function lkMsg(m,shake){LS.msg=m;const el=$('#lkm');if(el)el.textContent=m;if(shake){const d=$('#lkdt');if(d){d.classList.remove('sh');void d.offsetWidth;d.classList.add('sh')}}}
function lkR(){const m=LS.m,el=$('#lk');
if(m=='wait'||m=='off'){el.innerHTML=`<div class="lkw"><div class="lkt">${m=='wait'?'Connecting…':'No Connection'}</div><div class="lkm" id="lkm">${esc(LS.msg)}</div>${m=='off'?'<button class="btn ghost" onclick="lkInit()">Try again</button>':''}</div>`;return}
const T={unlock:'Enter Passcode',new1:'Create a Passcode',new2:'Confirm Passcode',old:'Enter Your Passcode',chg0:'Enter Current Passcode',chg1:'Enter New Passcode',chg2:'Confirm New Passcode'};
const K=[['1',''],['2','ABC'],['3','DEF'],['4','GHI'],['5','JKL'],['6','MNO'],['7','PQRS'],['8','TUV'],['9','WXYZ']];
el.innerHTML=`<div class="lkw"><div class="lkt">${T[m]||''}</div><div class="lkm" id="lkm">${esc(LS.msg)}</div><div class="lkdt" id="lkdt"></div><div class="lkp">${K.map(k=>`<button onclick="lkK('${k[0]}')">${k[0]}<small>${k[1]}</small></button>`).join('')}<button class="e"></button><button onclick="lkK('0')">0<small></small></button><button class="t" id="lkx" onclick="lkK('x')"></button></div>${m=='unlock'?'<button class="lkl" onclick="lkForgot()">Forgot passcode?</button>':''}</div>`;lkDots();lkX()}
function lkK(k){if(LS.busy)return;
if(k=='x'){if(LS.b){LS.b=LS.b.slice(0,-1);lkDots();lkX();return}if(/^chg/.test(LS.m))lkClose();return}
if(LS.until>Date.now()){lkMsg('Too many tries. Wait a moment.');return}
if(LS.b.length>=6)return;LS.b+=k;lkDots();lkX();if(LS.b.length==6)setTimeout(lkDone,120)}
function lkBad(msg,re){HP('e');LS.fail++;if(LS.fail>=5){LS.until=Date.now()+30000;LS.fail=0;msg='Too many tries. Wait 30 seconds.'}LS.b='';if(re){LS.msg='';lkR()}lkDots();lkX();lkMsg(msg,1)}
async function lkCheck(pin){
if(navigator.onLine!==false){try{const r=await rpc('ht_verify',{p:pin},6000);
if(r.ok){if(!LK||LK.h!==await lkH(pin,LK.s))await mkLK(pin);return 'ok'}
if(r.reason=='locked')return 'wait';if(r.reason=='bad')return 'bad'}catch(e){}}
return LK&&LK.h===await lkH(pin,LK.s)?'ok':'bad'}
async function lkDone(){const pin=LS.b,m=LS.m;LS.busy=1;
try{
if(m=='unlock'||m=='chg0'||m=='old'){let r;
if(m=='old'){try{const v=await rpc('ht_verify',{p:pin},8000);r=v.ok?'ok':v.reason=='locked'?'wait':'bad';if(v.ok){await mkLK(pin);SB.syn=0;sbs()}}catch(e){lkBad('Go online for first-time setup.');return}}
else r=await lkCheck(pin);
if(r=='ok'){LS.fail=0;if(m=='chg0'){PIN=pin;LS.m='chg1';LS.b='';LS.msg='';lkR()}else{PIN=pin;lkOpen()}}
else lkBad(r=='wait'?'Too many attempts. Try again in a few minutes.':'Incorrect passcode')}
else if(m=='new1'||m=='chg1'){LS.f=pin;LS.m=m=='new1'?'new2':'chg2';LS.b='';LS.msg='';lkR()}
else if(m=='new2'||m=='chg2'){if(pin!=LS.f){LS.m=m=='new2'?'new1':'chg1';lkBad('Passcodes did not match. Try again.',1)}else await lkSet(pin,m=='chg2')}
}finally{LS.busy=0}}
async function lkSet(pin,ch){
try{const r=await rpc('ht_set_pin',{new_pin:pin,old_pin:ch?PIN:null},10000);
if(!r.ok){if(!ch&&r.reason!='invalid'){LS.m='old';LS.b='';lkR();lkMsg('A passcode already exists. Enter it.')}else{LS.m=ch?'chg1':'new1';LS.b='';lkR();lkMsg(r.reason=='invalid'?'Use exactly 6 digits.':'Could not change it ('+r.reason+').',1)}return}
await mkLK(pin);PIN=pin;SB.syn=0;sbs();
if(ch){tpS();lkClose();sbMsg('Passcode changed.');go(tab,1)}else lkOpen()
}catch(e){LS.m=ch?'chg1':'new1';LS.b='';lkR();lkMsg('You need to be online to do that.',1)}}
function lkForgot(){if(!confirm('Reset the passcode on this device? You will need your passcode again to get back in. If you forgot it, reset it in Supabase first (see the note at the bottom of supabase-setup.sql).'))return;
LK=null;try{localStorage.removeItem('ht_lk');localStorage.removeItem('ht_tp')}catch(e){}PIN='';lkInit()}
async function lkInit(){if(!(window.crypto&&crypto.subtle))return;
if(LK){let t=null;try{t=localStorage.getItem('ht_tp')}catch(e){}if(t){PIN=t;go(tab,1);sync();return}lkShow('unlock');return}
LS.msg='';lkShow('wait');
try{const r=await rpc('ht_status',{},8000);lkShow(r.has_pin?'old':'new1')}catch(e){LS.m='off';LS.msg='Connect to the internet once to set up your passcode.';lkR()}}
function cloud(){return `<div class="card"><h2>Passcode</h2><p class="sub">Your progress syncs to the cloud automatically. This device stays unlocked. You only enter the passcode on a new device or browser, or after Lock now.</p><p class="sub" id="sbm">${esc(sbm)}</p><button class="btn" onclick="sync()">Sync now</button><div class="row"><button class="btn ghost" onclick="try{localStorage.removeItem('ht_tp')}catch(e){}lkShow('unlock')">Lock now</button><button class="btn ghost" onclick="lkShow('chg0')">Change passcode</button></div><p class="sub" style="margin-top:10px">App version ${APP_V}</p></div>`}
go('today');mini();remCheck();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
let td=fd(new Date());
document.addEventListener('visibilitychange',()=>{if(document.hidden){persist();return}const n=fd(new Date());if(n!=td){if(sel==td)sel=n;td=n;go(tab,1)}sync()});
addEventListener('online',()=>sync());addEventListener('focus',()=>{if(!LS.m)sync()});setInterval(poll,2000);sync();lkInit();

/* ===== Apple-style gestures =====
   1) Swipe a sheet down (from the grabber, or from the top of its content) to dismiss it.
   2) Swipe right from the left edge to go back, only on pages that are "pushed" (Settings, or a day other than today).
      Root tabs (Today, Week, Plan...) do not swipe back, like Apple's tab roots. */
(()=>{const sh=$('#sh'),bd=$('#bd'),B=document.body;let g=null;
sh.addEventListener('touchstart',e=>{if(e.touches.length!=1||!B.classList.contains('so')){g=null;return}const t=e.touches[0],r=sh.getBoundingClientRect();
g={y:t.clientY,x:t.clientX,dy:0,on:0,v:0,ly:t.clientY,lt:e.timeStamp,h:t.clientY-r.top<56}},{passive:true});
sh.addEventListener('touchmove',e=>{if(!g)return;const t=e.touches[0],dx=t.clientX-g.x;let dy=t.clientY-g.y;
if(!g.on){if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>8){g=null;return}
if(!g.h&&sh.scrollTop>0){g.y=t.clientY;return}
if(dy<=6)return;g.on=1;g.y=t.clientY;dy=0;sh.style.transition='none';bd.style.transition='none';g.ly=t.clientY;g.lt=e.timeStamp}
if(e.cancelable)e.preventDefault();
const d=Math.max(0,dy),dt=e.timeStamp-g.lt;if(dt>0)g.v=g.v*.6+((t.clientY-g.ly)/dt)*.4;g.ly=t.clientY;g.lt=e.timeStamp;
g.dy=d;sh.style.transform='translateY('+d+'px)';bd.style.opacity=String(1-Math.min(1,d/(innerHeight*.5)))},{passive:false});
const end=()=>{if(!g)return;const q=g;g=null;if(!q.on)return;const close=q.dy>110||q.v>.55;
sh.style.transition='';bd.style.transition='';sh.style.transform='';bd.style.opacity='';if(close){HP('s');cl()}};
sh.addEventListener('touchend',end,{passive:true});sh.addEventListener('touchcancel',end,{passive:true})})();

const bkT=()=>tab=='set'?{t:PT=='set'?'today':PT,s:sel}:{t:'today',s:fd(new Date())};
const canBack=()=>!document.body.classList.contains('so')&&!document.body.classList.contains('lkd')&&!LS.m&&(tab=='set'||(tab=='today'&&sel!=fd(new Date())));
function goBack(){const T=bkT();sel=T.s;go(T.t)}
function bkStart(){const T=bkT(),t0=tab,s0=sel;let hh='',mm='';tab=T.t;sel=T.s;
try{head();hh=$('header').outerHTML;mm={today,week,plan,tips,ex:exs,set:settingsTab}[T.t]()}catch(e){}finally{tab=t0;sel=s0;head()}
const b=document.createElement('div');b.id='bk';b.innerHTML=hh+'<main>'+mm+'</main><i class="dm"></i>';
const cg=b.querySelector('#cg');if(cg)cg.classList.toggle('on',T.t=='set');b.querySelectorAll('[id]').forEach(x=>x.removeAttribute('id'));
b.style.transform='translateX(-28%)';document.body.appendChild(b);document.documentElement.classList.add('bkd')}
let BK=null;
addEventListener('touchstart',e=>{BK=null;if(e.touches.length!=1||!canBack())return;const t=e.touches[0];if(t.clientX>18)return;
BK={x:t.clientX,y:t.clientY,dx:0,on:0,v:0,lx:t.clientX,lt:e.timeStamp}},{passive:true});
addEventListener('touchmove',e=>{if(!BK)return;const t=e.touches[0],dx=t.clientX-BK.x,dy=t.clientY-BK.y;
if(!BK.on){if(Math.abs(dy)>10&&Math.abs(dy)>Math.abs(dx)){BK=null;return}if(dx<8)return;BK.on=1;bkStart();BK.lx=t.clientX;BK.lt=e.timeStamp}
if(e.cancelable)e.preventDefault();
const dt=e.timeStamp-BK.lt;if(dt>0)BK.v=BK.v*.6+((t.clientX-BK.lx)/dt)*.4;BK.lx=t.clientX;BK.lt=e.timeStamp;
const d=Math.max(0,dx),p=Math.min(1,d/innerWidth);BK.dx=d;$('#pg').style.transform='translateX('+d+'px)';
const bk=$('#bk');if(bk){bk.style.transform='translateX('+(-28*(1-p))+'%)';bk.querySelector('.dm').style.opacity=.2*(1-p)}},{passive:false});
function bkEnd(){const b=BK;BK=null;if(!b||!b.on)return;const pg=$('#pg'),bk=$('#bk');if(!bk){pg.style.transform='';return}
const w=innerWidth,yes=b.dx>w*.33||b.v>.45,dm=bk.querySelector('.dm'),tr='transform .42s var(--spring)';
pg.style.transition=tr;bk.style.transition=tr;dm.style.transition='opacity .42s';
pg.style.transform='translateX('+(yes?w:0)+'px)';bk.style.transform=yes?'translateX(0)':'translateX(-28%)';dm.style.opacity=yes?0:.2;
let d=0;const fin=()=>{if(d)return;d=1;if(yes){goBack();$('#m').className=''}pg.style.transform='';pg.style.transition='';bk.remove();document.documentElement.classList.remove('bkd')};
pg.addEventListener('transitionend',e=>{if(e.target===pg)fin()});setTimeout(fin,560);if(yes)HP('s')}
addEventListener('touchend',bkEnd,{passive:true});addEventListener('touchcancel',bkEnd,{passive:true});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
