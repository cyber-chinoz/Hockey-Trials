<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trials">
<meta name="theme-color" content="#0f3d2e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Trials Tracker</title>
<style>
:root{--bg:#f2f4ee;--card:#fff;--ink:#10231b;--mut:#5d7367;--line:#d5e0d8;--turf:#0f3d2e;--ball:#e8540f;--ok:#1d7a4d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0a1b14;--card:#10291d;--ink:#eaf2ec;--mut:#8fa99a;--line:#1f3d2d;--turf:#0a1b14;--ball:#ff7a3d;--ok:#5fd08e}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,system-ui,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--turf);z-index:9}
h1,h2,.big{font-family:"Avenir Next Condensed","Arial Narrow",Impact,sans-serif;font-weight:700;letter-spacing:.01em;margin:0}
header{background:var(--turf);color:#f2f4ee;padding:14px 18px 20px;display:flex;gap:16px;align-items:center}
header .t{flex:1;min-width:0}header h1{font-size:30px;line-height:1.05}
header p{margin:4px 0 0;color:#b9d2c3;font-size:14px}
.ring{width:84px;height:84px;flex:none;position:relative}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 22px "Avenir Next Condensed","Arial Narrow",sans-serif;text-align:center;line-height:1}
.ring small{display:block;font:500 10px -apple-system,sans-serif;color:#b9d2c3;margin-top:2px}
main{padding:14px 14px 0;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:22px;margin-bottom:2px}.sub{color:var(--mut);font-size:14px;margin:0 0 8px}
.chip{display:inline-block;background:var(--turf);color:#f2f4ee;border-radius:99px;padding:2px 10px;font-size:13px;margin-right:6px}
.note{border-left:4px solid var(--ball);padding:6px 10px;margin:8px 0;font-size:14px;background:color-mix(in srgb,var(--ball) 8%,transparent)}
.it{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.it:first-of-type{border-top:0}
.bx{width:26px;height:26px;border-radius:50%;border:2px solid var(--mut);flex:none;display:grid;place-items:center;color:#fff;font-size:15px}
.it.on .bx{background:var(--ok);border-color:var(--ok)}.it.on span{color:var(--mut);text-decoration:line-through}
button,select,input,textarea{font:inherit;color:inherit}
.btn{width:100%;border:0;border-radius:12px;padding:14px;font-weight:600;font-size:17px;background:var(--ball);color:#fff;margin-top:10px}
.btn.done{background:var(--ok)}.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.row{display:flex;gap:8px;align-items:center;margin-top:10px}.row>*{flex:1}
.mood{display:flex;gap:6px}.mood button{flex:1;padding:10px 0;border-radius:10px;border:1px solid var(--line);background:transparent}
.mood button.on{background:var(--turf);color:#f2f4ee;border-color:var(--turf)}
input,textarea,select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:transparent}
textarea{min-height:80px;resize:vertical}
label{font-size:13px;color:var(--mut);display:block;margin:10px 0 4px}
.wk{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.wk:first-of-type{border-top:0}.wk .d{width:54px;font-weight:600}.wk .s{flex:1;color:var(--mut);font-size:14px}.wk.today .d{color:var(--ball)}
.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.nav button{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px}
.ph{padding:10px 0;border-top:1px solid var(--line)}.ph:first-of-type{border-top:0}.ph.cur{border-left:4px solid var(--ball);padding-left:10px}
.ph b{font-size:16px}.ph div{font-size:14px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:3px;text-align:center}th{color:var(--mut);font-weight:500}td:first-child{text-align:left;width:34%}
td input{padding:6px 2px;text-align:center}
ul.tp{padding-left:18px;margin:6px 0}.tp li{margin-bottom:8px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;padding:12px 0 10px;color:var(--mut);font-size:13px}nav button.on{color:var(--ball);font-weight:700}
nav button i{display:block;font-style:normal;font-size:20px}
</style></head><body>
<header><div class="t"><h1 id="h1"></h1><p id="hp"></p></div><div class="ring" id="ring"></div></header>
<main id="m"></main>
<nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s),pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)},
fd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),
add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x},esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={};try{S=JSON.parse(localStorage.getItem('ht1')||'{}')}catch(e){}
S.log=S.log||{};S.bm=S.bm||{};S.trial=S.trial||'2027-02-02';
const save=()=>{try{localStorage.setItem('ht1',JSON.stringify(S))}catch(e){}};
const START=pd('2026-10-15'),DN=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const P=[
{n:'Foundation',s:'Oct 15',e:'2026-11-04',g:'Learn the movements and build consistency. Easy walking only: no hard running or sprints. Keep 3 good reps in reserve.'},
{n:'Strength and running base',s:'Nov 5',e:'2026-11-25',g:'Progress push-ups and legs, add the 8 kg weights, start gentle walk-jog intervals if ready.'},
{n:'Athletic development',s:'Nov 26',e:'2026-12-23',g:'Running endurance, smooth acceleration, lateral movement and braking. No max-effort sprints yet.'},
{n:'Hockey conditioning',s:'Dec 24',e:'2027-01-13',g:'Repeated-effort fitness. Friday is the one hard day; keep everything else controlled.'},
{n:'Sharpen and taper',s:'Jan 14',e:'2027-02-02',g:'Keep strength and speed, shed fatigue, arrive fresh.'}];
const W='Warm-up (5–10 min; 8–12 before fast running)|';
const X={
1:{1:['Strength A','20–25 min',W+'Bodyweight squat 2×6|Wall push-up 2×6|Glute bridge 2×8|Calf raise 2×10|Dead bug 2×5 per side'],
2:['Aerobic + mobility','20–25 min','Comfortable walk 15–20 min|Cat–cow 8 reps|Hip-flexor stretch 30 s per side|Open-book rotations 6 per side|Wall angels 8 reps'],
3:['Strength B','20–25 min',W+'Hip hinge 2×8|Supported reverse lunge 2×4 per leg|Wall push-up 2×6|Bird dog 2×5 per side|Bent-knee side plank 2×10 s per side'],
5:['Speed movement basics','15–20 min','Easy march or walk 5 min|Side steps 3×20 s|Forward and back steps 3×20 s|Single-leg balance 2×15 s per leg|Gentle calf raises 2×10'],
6:['Easy aerobic','15–25 min','Comfortable walk 15–25 min (build toward 25–30)|Cool down 3–5 min|Log how long and how it felt']},
2:{1:['Strength A','30–35 min',W+'Squats 3×8–10|Incline push-ups 3×5–8|Glute bridges 3×10|Calf raises 3×12|Dead bugs 3×6 per side'],
2:['Aerobic fitness','20–35 min','Warm up 5 min|Jog 1 min, walk 2 min: 3–4 rounds, build to 6|Cool down 3–5 min|Short mobility routine'],
3:['Strength B','30–35 min',W+'Dumbbell Romanian deadlift 2–3×8|Supported reverse lunge 3×5 per leg|Bent-over dumbbell row 3×8|Bird dog 2×6 per side|Bent-knee side plank 2×15–20 s per side'],
5:['Movement and agility','20–25 min','Warm-up walk 5 min|Side steps 3×20 s|Forward/back steps 3×20 s|Controlled lateral shuffles 3×5 m each way|Single-leg balance 2×20 s per leg'],
6:['Conditioning + strength','25–35 min','Easy walk or walk-jog 20–25 min|Bodyweight squat 2×8|Glute bridge 2×10|Calf raise 2×12']},
3:{1:['Strength A','30–35 min',W+'Goblet squat, one 8 kg 3×8–10 (bodyweight if not ready)|Incline or knee push-ups 3×6–10|Glute bridges 3×12|Calf raises 3×15|Dead bugs 3×8 per side'],
2:['Aerobic base','25–40 min','Easy run or run-walk 20–35 min, conversational|Mobility 8–10 min'],
3:['Strength B','30–35 min',W+'Romanian deadlift, two 8 kg 3×10|Reverse lunges 3×6–8 per leg|Bent-over rows 3×10|Bird dogs 2×8 per side|Side planks 3×20 s per side'],
5:['Acceleration + agility','25–35 min','Warm up 8–10 min|Accelerations 4×10 m at 60–70% effort|Lateral shuffles 3×5 m each way|Forward-to-backward movement 3×10 s|Single-leg balance 2×20 s per leg|Walk back and recover fully between reps'],
6:['Conditioning + strength','30–40 min','Easy cardio 20–30 min|Squats 2×10|Glute bridges 2×12|Calf raises 2×15']},
4:{1:['Strength A','30–35 min',W+'Goblet squat 3×10|Push-up variation 3×8–12|Glute bridge 3×12|Calf raises 3×15|Dead bugs 3×8 per side'],
2:['Aerobic base','30–45 min','Easy run or run-walk 25–35 min|Mobility 8–10 min'],
3:['Strength B','30–35 min',W+'Romanian deadlift 3×10|Reverse lunges 3×8 per leg|Dumbbell rows 3×10–12|Bird dogs 2×8 per side|Side planks 3×25–30 s per side'],
5:['Repeat-effort conditioning','30–40 min','Warm up 10–12 min: easy movement, dynamic mobility, gradual accelerations|Set 1: 4 × (15 s fast at 75–85%, then 60–90 s easy walk/jog)|Rest 3 min|Set 2: same 4 efforts, only if set 1 felt controlled|Cool down walk 5 min'],
6:['Easy conditioning','30–50 min','Easy cardio 20–30 min|Mobility 8–10 min']}};
const TIPS=[
['Test yourself four times','Use the benchmark grid below at the start, week 6, week 11 and week 15. Same route, same time of day. Numbers beat feelings for knowing what is working.'],
['Rate every session','Tap an effort score after each session. If you hit 4 or 5 on easy days, or soreness lasts past 48 hours, repeat the previous week.'],
['Check the ramp-up in Phase 3 and 4','Going from walk-jog to repeated 15 s efforts is the biggest jump in the plan. If Tuesday still needs walk breaks, stay on the Phase 3 Friday session. Use Hold phase in Plan.'],
['Practise the hockey stance','Forwards play low. Add 30–60 s of holding a hips-back, chest-forward half-squat to Strength A once squats feel easy.'],
['Make posture a habit','The posture finisher is on Monday, Wednesday and Saturday. Also set your phone to remind you twice a day: chin back, shoulders down and back, ribs stacked over hips. Retake side photos every four weeks.'],
['Train braking, not just speed','Practise decelerating in 2–3 steps on Fridays from Phase 3. Fast starts and clean stops are what a forward is judged on.'],
['Protect the basics','Sleep 8 hours, drink water through the day, eat protein with each meal. Training only works if you recover from it.'],
['Confirm the trial date','Set it in Plan. The app counts down and the final week should be planned backwards from it.']];
let sel=fd(new Date()),tab='today';
const phase=d=>{if(S.hold)return S.hold;const t=fd(d);for(let i=0;i<5;i++)if(t<=P[i].e)return i+1;return 5};
const PO='Posture finisher (5 min): chin tucks 2×8|Prone Y raises on the mat 2×8, hold 2 s|Wall angels 2×8|Hip-flexor stretch 30 s per side';
const sess=d=>{const w=d.getDay();if(w==0||w==4)return null;const r=X[Math.min(phase(d),4)][w];if(!r)return null;let i=r[2].split('|'),m=r[1];if(w==1||w==3||w==6){i=i.concat(PO.split('|'));m+=' + 5 min posture'}return{t:r[0],m,i}};
const mon=d=>add(d,-((d.getDay()+6)%7));
function weekDone(d){const m=mon(d);let c=0;for(let i=0;i<7;i++){const k=fd(add(m,i));if(S.log[k]&&S.log[k].c&&sess(add(m,i)))c++}return c}
function head(){const d=pd(sel),ph=phase(d),tr=Math.round((pd(S.trial)-new Date(fd(new Date())+'T00:00'))/864e5),w=weekDone(d);
$('#h1').textContent=tab=='today'?DN[d.getDay()]+' '+d.toLocaleDateString(undefined,{day:'numeric',month:'short'}):'Trials Tracker';
$('#hp').textContent=`Phase ${ph}: ${P[ph-1].n} · ${tr>0?tr+' days to trials':tr==0?'Trial day':'Trials passed'}`;
const c=2*Math.PI*36,f=c*Math.min(w,5)/5;
$('#ring').innerHTML=`<svg viewBox="0 0 84 84" width="84" height="84"><circle cx="42" cy="42" r="36" fill="none" stroke="#ffffff33" stroke-width="7"/><circle cx="42" cy="42" r="36" fill="none" stroke="#ff7a3d" stroke-width="7" stroke-linecap="round" stroke-dasharray="${f} ${c}" transform="rotate(-90 42 42)"/></svg><b><span>${w}/5<small>this week</small></span></b>`}
function today(){const d=pd(sel),s=sess(d),e=S.log[sel]||{},x=e.x||[],ph=phase(d);let h='';
if(ph==5){const t=sel;h+=`<div class="note">${t<='2027-01-20'?'Sharpen: keep the normal pattern, add nothing new.':t<='2027-01-27'?'Reduce volume by 20–30%: fewer reps, no exhausting leg work.':'Taper: short and comfortable. No hard conditioning in the last 48 hours.'}</div>`}
if(!s){h+=`<div class="card"><h2>Rest day</h2><p class="sub">Recovery is when you adapt. Gentle walking is optional.</p><div class="it ${e.c?'on':''}" onclick="tc()"><div class="bx">${e.c?'✓':''}</div><span>Gentle walk done</span></div></div>`}
else{h+=`<div class="card"><h2>${s.t}</h2><p class="sub">${s.m} · ${P[ph-1].n}</p>${s.i.map((t,i)=>`<div class="it ${x.includes(i)?'on':''}" onclick="tg(${i})"><div class="bx">${x.includes(i)?'✓':''}</div><span>${esc(t)}</span></div>`).join('')}
<label>How hard was it? (1 easy · 5 maxed)</label><div class="mood">${[1,2,3,4,5].map(n=>`<button class="${e.e==n?'on':''}" onclick="se(${n})">${n}</button>`).join('')}</div>
<div class="row"><div><label>Minutes</label><input type="number" inputmode="numeric" value="${e.m||''}" oninput="sv('m',this.value)"></div></div>
<label>Notes: energy, soreness, running</label><textarea oninput="sv('n',this.value)">${esc(e.n)}</textarea>
<button class="btn ${e.c?'done':''}" onclick="tc()">${e.c?'Session complete ✓':'Mark session complete'}</button></div>`}
h+=`<div class="card"><b>This phase</b><p class="sub" style="margin:4px 0 0">${P[ph-1].g}</p></div>`;
if(sel!=fd(new Date()))h+=`<button class="btn ghost" onclick="sel=fd(new Date());go('today')">Back to today</button>`;
return h}
function week(){const m=mon(pd(sel)),n=fd(new Date());let h=`<div class="nav"><button onclick="sel=fd(add(pd(sel),-7));go('week')">‹ Prev</button><b>${m.toLocaleDateString(undefined,{day:'numeric',month:'short'})} – ${add(m,6).toLocaleDateString(undefined,{day:'numeric',month:'short'})}</b><button onclick="sel=fd(add(pd(sel),7));go('week')">Next ›</button></div><div class="card">`;
for(let i=0;i<7;i++){const d=add(m,i),k=fd(d),s=sess(d),e=S.log[k]||{};h+=`<div class="wk ${k==n?'today':''}" onclick="sel='${k}';go('today')"><span class="d">${DN[d.getDay()].slice(0,3)} ${d.getDate()}</span><span class="s">${s?s.t+' · '+s.m:'Rest'}</span><span>${e.c?'✅':s?'○':'💤'}</span></div>`}
return h+'</div>'}
function plan(){const cur=phase(pd(sel));let h='<div class="card">'+P.map((p,i)=>`<div class="ph ${i+1==cur?'cur':''}"><b>${i+1}. ${p.n}</b> <span class="sub">from ${p.s}</span><div>${p.g}</div></div>`).join('')+'</div>';
h+=`<div class="card"><label>Hold phase (stay here until you are ready)</label><select onchange="S.hold=+this.value||0;save();go('plan')"><option value="0">Follow the calendar</option>${P.map((p,i)=>`<option value="${i+1}" ${S.hold==i+1?'selected':''}>Stay on Phase ${i+1}: ${p.n}</option>`).join('')}</select>
<label>Trial date</label><input type="date" value="${S.trial}" onchange="S.trial=this.value||'2027-02-02';save();head()">
<label>Backup: copy this text somewhere safe, or paste a backup here and tap Restore</label><textarea id="bk">${esc(JSON.stringify(S))}</textarea>
<div class="row"><button class="btn ghost" onclick="try{JSON.parse($('#bk').value);localStorage.setItem('ht1',$('#bk').value);location.reload()}catch(e){alert('That backup text is not valid.')}">Restore</button></div></div>`;return h}
function tips(){const C=['Start','Week 6','Week 11','Week 15'],T=[['1.6 km time (min:sec)','t'],['Max good push-ups','p'],['Single-leg balance (s)','b']];
let h='<div class="card"><h2>Benchmarks</h2><p class="sub">Record on the same route and surface each time.</p><table><tr><th></th>'+C.map(c=>`<th>${c}</th>`).join('')+'</tr>'+T.map(t=>`<tr><td>${t[0]}</td>${C.map((c,i)=>`<td><input value="${esc((S.bm[t[1]]||[])[i])}" oninput="(S.bm['${t[1]}']=S.bm['${t[1]}']||[])[${i}]=this.value;save()"></td>`).join('')}</tr>`).join('')+'</table></div>';
return h+'<div class="card"><h2>Ways to improve the plan</h2><ul class="tp">'+TIPS.map(t=>`<li><b>${t[0]}.</b> ${t[1]}</li>`).join('')+'</ul></div>'}
function lg(){return S.log[sel]=S.log[sel]||{}}
function tg(i){const e=lg(),x=e.x=e.x||[],k=x.indexOf(i);k<0?x.push(i):x.splice(k,1);const s=sess(pd(sel));e.c=!!s&&x.length==s.i.length;save();go('today')}
function tc(){const e=lg();e.c=!e.c;save();go('today')}
function se(n){const e=lg();e.e=e.e==n?0:n;save();go('today')}
function sv(k,v){lg()[k]=v;save()}
function go(t){tab=t;const ae=document.activeElement;$('#m').innerHTML={today,week,plan,tips}[t]();
$('#nav').innerHTML=[['today','🏑','Today'],['week','📅','Week'],['plan','🗺️','Plan'],['tips','📈','Progress']].map(b=>`<button class="${tab==b[0]?'on':''}" onclick="go('${b[0]}')"><i>${b[1]}</i>${b[2]}</button>`).join('');head();window.scrollTo(0,0)}
go('today');
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
