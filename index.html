.yt{background:#ff0033}

.pls{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.pl{min-width:40px;height:34px;padding:0 10px;border-radius:99px;border:1.5px solid var(--line);background:transparent;font-size:14px;font-weight:600;color:var(--mut);transition:background .25s,color .25s,transform .3s var(--spring)}.pl.on{background:var(--ok);border-color:var(--ok);color:#fff}

.ln{fill:none;stroke:var(--ball);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.1s var(--spring) .15s forwards}@keyframes dr{to{stroke-dashoffset:0}}
